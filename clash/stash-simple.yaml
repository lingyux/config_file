# Stash iOS 专用模板：不含游戏 / ASMR 分流，VPN 接管由 Stash 管理。
# 使用前将 tag_url / wd_url 替换为 Clash YAML 节点订阅地址。

mode: rule
log-level: warning
ipv6: false

# Stash 3.6+；国外 DNS 跟随 Proxy，国内域名使用国内 DNS。
dns:
  follow-rule: true
  default-nameserver: [119.28.28.28, 119.29.29.29, 223.5.5.5]
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://223.5.5.5/dns-query
  nameserver:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
  nameserver-policy:
    'geosite:cn':
      - https://doh.pub/dns-query
      - https://sm2.doh.pub/dns-query
    '+.local': system
    '+.lan': system
    '+.home.arpa': system
    'localhost': system
  fake-ip-filter:
    - localhost
    - '+.local'
    - '+.lan'
    - '+.home.arpa'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'time.*.gov'
    - '+.ntp.org'
    - '+.stun.*.*'
    - '+.stun.*.*.*'

# 节点订阅每日更新，测速由 Stash 的策略组管理
NodeParam: &NodeParam {interval: 86400, benchmark-url: 'http://www.apple.com', benchmark-timeout: 2}

# 锚点 - 节点订阅
proxy-providers:
  tag:
    url: 'tag_url'
    <<: *NodeParam
    path: './proxy_provider/tag.yaml'
  wd:
    url: 'wd_url'
    <<: *NodeParam
    path: './proxy_provider/wd.yaml'

# 锚点 - 节点筛选组
FilterHK: &FilterHK '(?i)^(?=.*(🇭🇰|香港|(\b(HK|Hong)(\d+)?\b)))(?!.*(回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterTW: &FilterTW '(?i)^(?=.*(🇹🇼|台湾|(\b(TW|Tai|Taiwan)(\d+)?\b)))(?!.*(回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterJP: &FilterJP '(?i)^(?=.*(🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|Japan)(\d+)?\b)))(?!.*(回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterKR: &FilterKR '(?i)^(?=.*(🇰🇷|韩国|韓|首尔|(\b(KR|Korea)(\d+)?\b)))(?!.*(回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterSG: &FilterSG '(?i)^(?=.*(🇸🇬|新加坡|狮|(\b(SG|Singapore)(\d+)?\b)))(?!.*(回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterUS: &FilterUS '(?i)^(?=.*(🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|United States)(\d+)?\b)))(?!.*(回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterUK: &FilterUK '(?i)^(?=.*(🇬🇧|英国|伦敦|(\b(UK|United Kingdom)(\d+)?\b)))(?!.*(回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterFR: &FilterFR '(?i)^(?=.*(🇫🇷|法国|(\b(FR|France)(\d+)?\b)))(?!.*(回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterDE: &FilterDE '(?i)^(?=.*(🇩🇪|德国|(\b(DE|Germany)(\d+)?\b)))(?!.*(回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterAI: &FilterAI '(?i)^(?=.*(🇹🇼|台湾|(\b(TW|Tai|Taiwan)(\d+)?\b)|🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|Japan)(\d+)?\b)|🇸🇬|新加坡|狮|(\b(SG|Singapore)(\d+)?\b)|🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|United States)(\d+)?\b)))(?!.*(回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterAll: &FilterAll '(?i)^(?=.*(.))(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)(\d+)?\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$'

# 策略组参数锚点
# 故障转移：每 180 秒惰性测速，单节点超时见 NodeParam
FallBack: &FallBack {type: fallback, interval: 180, lazy: true, use: [tag, wd]}
# 锚点 - 手动选择参数
HandSelect: &HandSelect {type: select, interval: 300, lazy: true, use: [tag, wd]}
# 锚点 - 规则参数 [每天更新一次订阅规则]
RuleSet: &RuleSet {behavior: classical, interval: 86400, format: yaml}

